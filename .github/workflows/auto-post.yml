name: Auto-post project update

# On every merge to main, the reusable auto-poster action (from
# e4-explore/e4-efficiency) summarizes the change with Gemini, screenshots the
# live site, and drafts an in-voice X post about the update.
#
# Currently in DRY-RUN: runs the full pipeline and prints the drafted post to
# the Actions log without publishing. To go live, set the `dry-run` fallback
# below to 'false' (or trigger manually via "Run workflow" with dry-run=false).
#
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY, X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to post about (defaults to the triggering commit)
        required: false
        type: string
      dry-run:
        description: Preview the post without publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: e4-explore/e4-efficiency/actions/auto-post@v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          x-api-key: ${{ secrets.X_API_KEY }}
          x-api-secret: ${{ secrets.X_API_SECRET }}
          x-access-token: ${{ secrets.X_ACCESS_TOKEN }}
          x-access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          homepage-url: https://post-scorer-web.pages.dev
          routes: '["/"]'
          include-commit-link: 'false'
          # Dry-run for now — flip the fallback to 'false' to publish live.
          dry-run: ${{ github.event.inputs.dry-run || 'true' }}
          sha: ${{ github.event.inputs.sha }}
